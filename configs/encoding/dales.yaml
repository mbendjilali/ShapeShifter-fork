dales_root: /data/moussabendjilali/archive/data/dales_2
gt_root: data/dales
crop_size_m: 100.0
crop_stride_m: 100.0

voxel_size_initial: 0.2
initial_size: 256
# Level table (single source of truth). Pool-by-2 from initial_size:
# 256@0.2 · 128@0.4 · 64@0.8 · 32@1.6 · 16@3.2. 16 (3.2m) = coarse layout level.
targets: [128, 64, 32, 16]

ground_class: 1
# = len(classes); labels 1–8 one-hot as (sem−1). Must match diffusion_0/up.yaml
# and their class_weight length. (ddc0935 wrongly set 7 everywhere; reverted.)
n_classes: 8

min_points_per_crop: 500
device: cuda
