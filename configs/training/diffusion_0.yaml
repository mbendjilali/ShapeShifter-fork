# DALES — COARSE LAYOUT level (3.2m voxels, ~32×32×7 per 100m crop).
#
# Coarse-first generation: at this resolution the whole scene fits in a handful
# of voxels, so a full scene is ONE training sample (no clipping).  The U-Net's
# receptive field then spans the whole layout, so it learns p(scene-layout)
# instead of the translation-invariant per-column marginal that 0.8m/64³-clip
# training collapsed to.  Validate spatial layout diversity HERE before building
# the 16→32→64 upsamplers that refine it.
#
# Requires the 16.pt level on disk: re-encode with configs/encoding/dales.yaml
# (targets now include 16) so each crop has a 16.pt next to its 64.pt.
dataset: dales
manifest_path: configs/dataset/dales.yaml
src_path: data/dales

upsample_fac: 2
base_resolution: 16        # loads 16.pt (3.2m) as the diffusion level-0 grid

unet_depth: 2
layers: 3
first_ks: 3
one_layers: 6
features: 128
epochs: 100                 # coarse scenes are cheap; train longer on the small set

n_classes: 8
class_weight: [0.5, 0.5, 1.52, 2.0, 0.57, 1.67, 1.35, 0.5]

lr: 0.0001
batch_size: 8              # coarse dense scenes are tiny (~7k voxels) → larger batch
accumulate_steps: 1

random_crop: false
clip_size: null
empty_fill: zero

dropout: 0.05
time_emb: 128
ema_decay: 0.999

# Height-above-ground coordinate channel.
# z only: XY position within an arbitrary 100m crop carries no canonical layout,
# so keep horizontal translation-invariance and let the diffusion noise + learned
# layout prior place structure.
coord_features: z
coord_h_ref: 30.0
coord_xy_ref: 100.0

loss_weighting: p2
p2_k: 1.0
p2_gamma: 1.0
min_snr_gamma: 5.0

# Occupancy via the VOID class.  Occupancy is folded into the semantic
# categorical: [8 real classes + 1 'void'] form one (n_cls+1)-way softmax, so the
# empty state (void) is reproducible at sampling.  Occupancy = 1 − P(void);
# remove_mask keeps P(void) < 0.5 (tune via -occ_threshold).  void_weight scales
# the (majority) void category in the CE: lower → more occupancy (0.5 ≈ the ~30%
# data fraction), higher → prune harder.
void_weight: 0.5
per_sigma_bins: 5

diffusion_timesteps: 1000
save_every: 10
val_every: 2
val_crops: 32
