# DALES — niveaux 1–4 (upsampling)
dataset: dales
manifest_path: configs/dales_manifest.yaml
src_path: data/dales


upsample_fac: 2
base_resolution: 16

layers: 2
first_ks: 3
one_layers: 4
features: 128
epochs: 300

n_classes: 8
class_weight: [0.5, 0.2, 2.0, 2.0, 1.0, 5.0, 10.0, 0.5]



lr: 0.0001
batch_size: 16
clip_size: 20

dropout: 0.05
time_emb: 6
diffusion_timesteps: 1000
max_T: 500
save_every: 10
val_every: 2
val_crops: 32
