# DALES — niveaux 1–4 (upsampling)
dataset: dales
manifest_path: configs/dales_manifest.yaml
src_path: data/dales


upsample_fac: 2
base_resolution: 16

layers: 2
first_ks: 3
one_layers: 6
features: 128
epochs: 80

n_classes: 8
class_weight: [0.5, 0.5, 1.52, 2.0, 0.57, 1.67, 1.35, 0.5]

lr: 0.0001
batch_size: 8
accumulate_steps: 1

random_crop: false
clip_size: null
empty_fill: zero

dropout: 0.05
time_emb: 128
ema_decay: 0.999

coord_features: z
coord_h_ref: 30.0
coord_xy_ref: 100.0

loss_weighting: p2
p2_k: 1.0
p2_gamma: 1.0
min_snr_gamma: 5.0

occupancy_objective: void
void_weight: .5

occ_pos_weight_max: 8.0
occ_loss_weight: 1.0
occ_label_smoothing: 0.05
mask_input_dropout: 0.0

occ_loss_weighting: min_snr
occ_min_snr_gamma: 5.0
occ_logsnr_min: -2.0
per_sigma_bins: 5

diffusion_timesteps: 1000
max_T: 300
save_every: 10
val_every: 2
val_crops: 32
