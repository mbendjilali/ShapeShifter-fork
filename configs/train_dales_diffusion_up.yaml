# DALES — niveaux 1–4 (upsampling)
dataset: dales
manifest_path: dales_manifest.json
src_path: data/dales

upsample_fac: 2
base_resolution: 16

layers: 2
first_ks: 3
one_layers: 4
features: 128
epochs: 30000

lr: 0.0001
batch_size: 2
clip_size: 20

dropout: 0.05
time_emb: 6
diffusion_timesteps: 1000
max_T: 500
save_every: 500
val_every: 2000
