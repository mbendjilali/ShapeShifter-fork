# DALES — niveau 0 (base 16^3 dense)
dataset: dales
manifest_path: configs/dales_manifest.json
src_path: data/dales

upsample_fac: 2
base_resolution: 16

layers: 3
first_ks: 3
one_layers: 6
features: 256
epochs: 500

lr: 0.0001
batch_size: 4
clip_size: 20   # unused at level 0 but kept for consistency

dropout: 0.05
time_emb: 6
diffusion_timesteps: 1000
save_every: 50
val_every: 100
