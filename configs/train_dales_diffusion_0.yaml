# DALES — niveau 0 (base 16^3 dense)
dataset: dales
manifest_path: configs/dales_manifest.yaml
src_path: data_no_veg

upsample_fac: 2
base_resolution: 16

layers: 3
first_ks: 3
one_layers: 6
features: 256
epochs: 250

n_classes: 7
class_weight: [0.5, 2.0, 2.0, 1.0, 5.0, 10.0, 0.5]


lr: 0.0001
batch_size: 16
clip_size: 20   # unused at level 0 but kept for consistency

dropout: 0.05
time_emb: 6
diffusion_timesteps: 1000
save_every: 10
val_every: 2
val_crops: 32
